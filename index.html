<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f7f4ef;
    color:#303030;
    font-family:Inter,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-image:
        linear-gradient(rgba(255,255,255,.58),rgba(255,255,255,.58)),
        url("assets/img/brick-white.jpg"); /* optional */
    background-size:cover;
}

.container{
    width:min(700px,90%);
    text-align:center;
    padding:60px 40px;
    border-top:5px solid #8a6547;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(2px);
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.logo{
    width:90px;
    margin-bottom:30px;
}

.small{
    text-transform:uppercase;
    letter-spacing:4px;
    color:#556b5d;
    font-size:.9rem;
}

h1{
    font-family:"Cormorant Garamond",serif;
    font-size:4rem;
    margin:10px 0 20px;
    color:#222;
}

.divider{
    width:80px;
    height:2px;
    background:#8a6547;
    margin:25px auto;
}

p{
    font-size:1.15rem;
    line-height:1.8;
    color:#555;
}

.notice{
    margin-top:40px;
    display:inline-block;
    padding:14px 28px;
    border:1px solid #8a6547;
    color:#556b5d;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.85rem;
}

.footer{
    margin-top:50px;
    color:#888;
    font-size:.9rem;
}

</style>

</head>
<body>

<div class="container">

    <img class="logo" src="assets/img/logo-main-color.svg">

    <div class="small">
        WEBSITE UPDATE
    </div>

    <h1>Coming Soon</h1>

    <div class="divider"></div>

    <p>
        We're preparing a brand new online experience for
        <strong>T4Rentals</strong>.
        Our updated website will be available soon with current
        listings, property information, and community resources.
    </p>

    <div class="notice">
        Thank you for your patience
    </div>

    <div class="footer">
        Franklin, Pennsylvania
    </div>

</div>
